[harness]
name = "opencode"
model = "openrouter/openai/gpt-5-mini"

[evolution]
mode = "skill_only"
iterations = 5
frontier_size = 2
concurrency = 1
no_improvement_limit = 2

[dataset]
path = "../../web3.csv"
question_column = "question"
ground_truth_column = "ground_truth"
category_column = "category"
train_ratio = 0.67
val_ratio = 0.33

[scorer]
type = "multi_tolerance"
